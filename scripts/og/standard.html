<!doctype html>
<meta charset="utf-8">
<!--
  Vorlage für das Standard-Vorschaubild (public/images/og/standard.png).

  Erzeugt mit:  npm run og
  Siehe scripts/og-standardbild.mjs — dort steht auch, warum das Bild als
  Datei im Repo liegt und nicht bei jedem Build neu gerechnet wird.

  Die Schrift wird zur Laufzeit aus node_modules/@fontsource/poppins geladen
  und als data-URI eingesetzt, damit das Bild dieselbe Wortmarke trägt wie
  die Website.
-->
<style>
  @font-face {
    font-family: "Poppins";
    font-weight: 800;
    src: url("__POPPINS_800__") format("woff2");
  }
  @font-face {
    font-family: "Poppins";
    font-weight: 500;
    src: url("__POPPINS_500__") format("woff2");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #141729;
    font-family: "Poppins", sans-serif;
    color: #fff;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 80px;
    overflow: hidden;
  }
  /* Signal-Akzent oben — dieselbe Farbe wie der Marker auf der Website. */
  .rail { position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: #6E00FF; }
  /* `align-self` ist noetig: In einer Flex-Spalte ist `align-items: stretch`
     der Standard, und das zieht das Logo auf die volle Breite — die
     Wortmarke wird dadurch verzerrt. Breite explizit aus dem
     Seitenverhaeltnis der Quelle (456x144). */
  .logo { height: 58px; width: 184px; align-self: flex-start; }
  h1 {
    font-weight: 800; font-size: 66px; line-height: 1.08;
    letter-spacing: -0.025em; text-transform: uppercase; max-width: 900px;
  }
  h1 .mark { background: #6E00FF; padding: 0 12px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .foot { display: flex; align-items: center; justify-content: space-between; }
  .foot p { font-weight: 500; font-size: 27px; color: rgba(255,255,255,.72); }
  .foot span { font-weight: 500; font-size: 27px; color: #fff; }
</style>
<div class="rail"></div>
<img class="logo" src="__LOGO__" alt="">
<h1>Falsche KI kostet <span class="mark">mehr</span> als keine KI.</h1>
<div class="foot">
  <p>Automatisierungen &amp; individuelle Software</p>
  <span>kitech-software.de</span>
</div>
