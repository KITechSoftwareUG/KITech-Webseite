# Gemeinsame Security-Header (Spiegel von public/_headers).
# WICHTIG: nginx vererbt add_header/expires NICHT an einen Location-Block,
# sobald dieser selbst add_header/expires definiert. Deshalb wird diese
# Datei per "include" in JEDEM Location-Block eingebunden, der eigene
# add_header/expires-Direktiven setzt (siehe nginx.conf) - so gehen die
# Security-Header dort nicht verloren.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://stats.kitech-software.de; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://stats.kitech-software.de https://ipinfo.io https://k01-2025-u36730.vm.elestio.app; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
