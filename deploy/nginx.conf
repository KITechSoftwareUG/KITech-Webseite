# nginx-Konfiguration fuer die KITech-Software Vite/React-SPA
# Entspricht funktional public/_headers + public/_redirects (Lovable-Hosting),
# uebersetzt fuer den Betrieb hinter nginx/Coolify.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Gzip-Kompression --------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ---- Security-Header (Spiegel von public/_headers) ----------------
    # Gilt fuer alle Locations, die selbst KEINE eigenen add_header/expires
    # Direktiven definieren (nginx vererbt sonst nicht weiter, siehe unten).
    include /etc/nginx/conf.d/security-headers.conf;

    # ---- Caching fuer gehashte Build-Assets ---------------------------
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpe?g|gif|ico|webp|avif)$ {
        # Security-Header hier erneut einbinden: sobald ein Location-Block
        # eigene add_header/expires-Direktiven hat, werden die vom Server-
        # Level geerbten Header verworfen statt ergaenzt.
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # index.html selbst nie cachen (sonst bekommen Clients nach Deploys alte JS-Chunks referenziert)
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ---- SPA-Fallback (Aequivalent zu public/_redirects) --------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
